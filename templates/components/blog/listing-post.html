<article class="list-blog">
    <div class="blog-post-figure">
        {{#if post.thumbnail}}
            <figure class="blog-thumbnail">
                <a href="{{post.url}}">
                    {{> components/common/responsive-img
                        image=post.thumbnail
                        fallback_size=theme_settings.blog_size
                        lazyload=theme_settings.lazyload_mode
                    }}
                </a>
            </figure>
        {{/if}}
    </div>

    <div class="blog-post-body">
        <div class="post-body--top">
            <header class="blog-header">
                <h2 class="heading-3 blog-title ob-body-lg">
                    <a href="{{post.url}}">{{post.title}}</a>
                </h2>
                <p class="blog-date ob-body-sm">{{#if post.author}}{{lang 'blog.posted_by' name=post.author}} on {{/if}}{{post.date_published}}</p>
            </header>

            <div class="blog-post">
                <div class="ob-body-sm">{{{post.summary}}}&hellip;</div>
            </div>
        </div>

        <a href="{{url}}" class="read-more {{#if theme_settings.theme_type '==' 'vogue'}}ob-btn ob-btn-border{{/if}}"
            aria-label="{{post.title}} {{lang 'blog.read_more'}}"><span>{{lang 'blog.read_more'}}</span></a>
    </div>
</article>
