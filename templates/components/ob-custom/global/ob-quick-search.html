<div class="container">
    <form class="form" onsubmit="return false" data-url="{{urls.search}}" data-quick-search-form>
        <fieldset class="form-fieldset">
            <div class="form-field">
                <label class="is-srOnly" for="nav-menu-quick-search">{{lang "search.quick_search.input_label"}}</label>
                <input class="form-input"
                       data-search-quick
                       name="nav-menu-quick-search"
                       id="nav-menu-quick-search"
                       data-error-message="{{lang 'search.error.empty_field'}}"
                       placeholder="{{lang 'search.quick_search.input_placeholder'}}"
                       autocomplete="off"
                >
                <button class="button button--primary form-prefixPostfix-button--postfix
                {{#if theme_settings.theme_type '==' 'vogue'}} ob-btn-border{{/if}}" type="submit">
                    {{#if theme_settings.theme_type '==' 'vogue'}}
                        <svg><use xlink:href="#icon-duo-search" /></svg>
                    {{else}}
                        <svg><use xlink:href="#icon-search" /></svg>
                    {{/if}}
                    {{lang 'search.results.form_button_text'}}
                </button>
            </div>
        </fieldset>
    </form>
    <section class="quickSearchResults" data-bind="html: results"></section>
    <p role="status"
       aria-live="polite"
       class="aria-description--hidden"
       data-search-aria-message-predefined-text="{{{lang 'search.results.quick_count_live'}}}"
    ></p>
</div>
